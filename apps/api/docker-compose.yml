services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habits_user
      POSTGRES_PASSWORD: habits_password
      POSTGRES_DB: habits
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habits_user -d habits']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://habits_user:habits_password@db:5432/habits
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://habits_user:habits_password@db:5432/habits
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
